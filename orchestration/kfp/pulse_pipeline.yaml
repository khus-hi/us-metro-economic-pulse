pipelineInfo:
  description: 'Monthly: ingest public economic data for the top 50 US metros, build
    the dbt marts in DuckDB, test them, export mart CSVs.'
  name: us-metro-economic-pulse
root:
  dag:
    tasks:
      dbt-run:
        cachingOptions: {}
        componentRef:
          name: comp-dbt-run
        dependentTasks:
        - ingest-2
        - ingest-3
        - ingest-4
        - ingest-5
        - ingest-6
        - ingest-7
        taskInfo:
          name: dbt run
      dbt-test:
        cachingOptions: {}
        componentRef:
          name: comp-dbt-test
        dependentTasks:
        - dbt-run
        taskInfo:
          name: dbt test
      export-marts:
        cachingOptions: {}
        componentRef:
          name: comp-export-marts
        dependentTasks:
        - dbt-test
        taskInfo:
          name: export marts
      ingest:
        cachingOptions: {}
        componentRef:
          name: comp-ingest
        inputs:
          parameters:
            source:
              runtimeValue:
                constant: crosswalk
            start_year:
              componentInputParameter: start_year
        taskInfo:
          name: crosswalk
      ingest-2:
        cachingOptions: {}
        componentRef:
          name: comp-ingest-2
        dependentTasks:
        - ingest
        inputs:
          parameters:
            source:
              runtimeValue:
                constant: bls
            start_year:
              componentInputParameter: start_year
        taskInfo:
          name: ingest bls
      ingest-3:
        cachingOptions: {}
        componentRef:
          name: comp-ingest-3
        dependentTasks:
        - ingest
        inputs:
          parameters:
            source:
              runtimeValue:
                constant: fred
            start_year:
              componentInputParameter: start_year
        taskInfo:
          name: ingest fred
      ingest-4:
        cachingOptions: {}
        componentRef:
          name: comp-ingest-4
        dependentTasks:
        - ingest
        inputs:
          parameters:
            source:
              runtimeValue:
                constant: census_acs
            start_year:
              componentInputParameter: start_year
        taskInfo:
          name: ingest census_acs
      ingest-5:
        cachingOptions: {}
        componentRef:
          name: comp-ingest-5
        dependentTasks:
        - ingest
        inputs:
          parameters:
            source:
              runtimeValue:
                constant: bea
            start_year:
              componentInputParameter: start_year
        taskInfo:
          name: ingest bea
      ingest-6:
        cachingOptions: {}
        componentRef:
          name: comp-ingest-6
        dependentTasks:
        - ingest
        inputs:
          parameters:
            source:
              runtimeValue:
                constant: oews
            start_year:
              componentInputParameter: start_year
        taskInfo:
          name: ingest oews
      ingest-7:
        cachingOptions: {}
        componentRef:
          name: comp-ingest-7
        dependentTasks:
        - ingest
        inputs:
          parameters:
            source:
              runtimeValue:
                constant: postings
            start_year:
              componentInputParameter: start_year
        taskInfo:
          name: ingest postings
  inputDefinitions:
    parameters:
      start_year:
        defaultValue: 2015.0
        isOptional: true
        parameterType: NUMBER_INTEGER
schemaVersion: 2.1.0
sdkVersion: kfp-2.18.0
