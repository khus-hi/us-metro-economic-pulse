# PIPELINE DEFINITION
# Name: us-metro-economic-pulse
# Description: Monthly: ingest public economic data for the top 50 US metros, build the dbt marts in DuckDB, test them, export mart CSVs.
# Inputs:
#    start_year: int [Default: 2015.0]
components:
  comp-dbt-run:
    executorLabel: exec-dbt-run
  comp-dbt-test:
    executorLabel: exec-dbt-test
  comp-export-marts:
    executorLabel: exec-export-marts
    outputDefinitions:
      artifacts:
        marts:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-ingest:
    executorLabel: exec-ingest
    inputDefinitions:
      parameters:
        source:
          parameterType: STRING
        start_year:
          parameterType: NUMBER_INTEGER
  comp-ingest-2:
    executorLabel: exec-ingest-2
    inputDefinitions:
      parameters:
        source:
          parameterType: STRING
        start_year:
          parameterType: NUMBER_INTEGER
  comp-ingest-3:
    executorLabel: exec-ingest-3
    inputDefinitions:
      parameters:
        source:
          parameterType: STRING
        start_year:
          parameterType: NUMBER_INTEGER
  comp-ingest-4:
    executorLabel: exec-ingest-4
    inputDefinitions:
      parameters:
        source:
          parameterType: STRING
        start_year:
          parameterType: NUMBER_INTEGER
  comp-ingest-5:
    executorLabel: exec-ingest-5
    inputDefinitions:
      parameters:
        source:
          parameterType: STRING
        start_year:
          parameterType: NUMBER_INTEGER
  comp-ingest-6:
    executorLabel: exec-ingest-6
    inputDefinitions:
      parameters:
        source:
          parameterType: STRING
        start_year:
          parameterType: NUMBER_INTEGER
  comp-ingest-7:
    executorLabel: exec-ingest-7
    inputDefinitions:
      parameters:
        source:
          parameterType: STRING
        start_year:
          parameterType: NUMBER_INTEGER
deploymentSpec:
  executors:
    exec-dbt-run:
      container:
        args:
        - cd /app/models && mkdir -p /data/warehouse && dbt seed --profiles-dir .
          && dbt run --profiles-dir .
        command:
        - sh
        - -c
        image: pulse-pipeline:0.1
    exec-dbt-test:
      container:
        args:
        - cd /app/models && mkdir -p /data/warehouse && dbt source freshness --profiles-dir
          . && dbt test --profiles-dir .
        command:
        - sh
        - -c
        image: pulse-pipeline:0.1
    exec-export-marts:
      container:
        args:
        - --out
        - '{{$.outputs.artifacts[''marts''].path}}'
        command:
        - python
        - /app/dashboard/export_marts.py
        image: pulse-pipeline:0.1
    exec-ingest:
      container:
        args:
        - '{{$.inputs.parameters[''source'']}}'
        - --start-year
        - '{{$.inputs.parameters[''start_year'']}}'
        command:
        - python
        - -m
        - ingest
        - run
        image: pulse-pipeline:0.1
    exec-ingest-2:
      container:
        args:
        - '{{$.inputs.parameters[''source'']}}'
        - --start-year
        - '{{$.inputs.parameters[''start_year'']}}'
        command:
        - python
        - -m
        - ingest
        - run
        image: pulse-pipeline:0.1
    exec-ingest-3:
      container:
        args:
        - '{{$.inputs.parameters[''source'']}}'
        - --start-year
        - '{{$.inputs.parameters[''start_year'']}}'
        command:
        - python
        - -m
        - ingest
        - run
        image: pulse-pipeline:0.1
    exec-ingest-4:
      container:
        args:
        - '{{$.inputs.parameters[''source'']}}'
        - --start-year
        - '{{$.inputs.parameters[''start_year'']}}'
        command:
        - python
        - -m
        - ingest
        - run
        image: pulse-pipeline:0.1
    exec-ingest-5:
      container:
        args:
        - '{{$.inputs.parameters[''source'']}}'
        - --start-year
        - '{{$.inputs.parameters[''start_year'']}}'
        command:
        - python
        - -m
        - ingest
        - run
        image: pulse-pipeline:0.1
    exec-ingest-6:
      container:
        args:
        - '{{$.inputs.parameters[''source'']}}'
        - --start-year
        - '{{$.inputs.parameters[''start_year'']}}'
        command:
        - python
        - -m
        - ingest
        - run
        image: pulse-pipeline:0.1
    exec-ingest-7:
      container:
        args:
        - '{{$.inputs.parameters[''source'']}}'
